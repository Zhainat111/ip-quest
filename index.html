const icons=['🧮','🔢','🖧','🔍','🧩','🏆'],counts=[10,5,5,5,5,10],KEY='ipquest-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}state.best=Array.isArray(state.best)?state.best:[0,0,0,0,0,0];let language=state.lang||'kk',stage=-1,index=0,score=0,locked=false,entry={},selected=null,stageItems=[];const $=id=>document.getElementById(id),t=k=>messages[language][k],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saveInfo').textContent='✓'}catch(e){$('saveInfo').textContent=''}}function seedShuffle(a){return a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x)}function page(n){['home','play','finish','certPage'].forEach(id=>$(id).classList.add('hidden'));$(n).classList.remove('hidden');window.scrollTo({top:0,behavior:'instant'})}function translate(){document.documentElement.lang=language;$('language').value=language;document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t)});$('student').placeholder=t('student');renderHome();if(stage>=0&&!$('play').classList.contains('hidden'))draw()}
function renderHome(){let total=state.best.reduce((a,b)=>a+b,0);$('totalStars').textContent=total+' / 40';$('completed').textContent=state.best.filter((v,i)=>v===counts[i]).length+' / 6';$('student').value=state.name||'';$('levels').innerHTML=counts.map((c,i)=>`<button class="level" data-level="${i}"><span class="emoji">${icons[i]}</span><span class="num">${i+1} / 6</span><h3>${esc(t('levelLabels')[i])}</h3><p>${esc(t('levelDesc')[i])}</p><div class="mini">⭐ ${state.best[i]} / ${c} · ${c} ${esc(t('remaining'))}</div>${state.best[i]===c?'<small>✓</small>':''}</button>`).join('');document.querySelectorAll('[data-level]').forEach(el=>el.onclick=()=>start(Number(el.dataset.level)))}
function start(n){stage=n;index=0;score=0;locked=false;entry={};selected=null;let source=[DATA.calc,DATA.binary,DATA.same,DATA.wrong,DATA.match,DATA.challenge][n];stageItems=n===5?seedShuffle(source).slice(0,10):source.slice();page('play');draw()}
function draw(){let o=stageItems[index];if(!o)return;const isChallenge=stage===5;$('stageTitle').textContent=icons[stage]+' '+t('levelLabels')[stage];$('stageCount').textContent=`${t('step')} ${index+1} / ${stageItems.length}`;$('stageScore').textContent=`⭐ ${score}`;$('progressBar').style.width=100*index/stageItems.length+'%';let html='';const ip=o.ip,mask=o.mask;const header=`<div class="hint">IP: ${esc(ip)} · ${t('mask')}: ${esc(mask)}</div>`;const field=(id,label,placeholder)=>`<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" autocomplete="off" spellcheck="false" placeholder="${placeholder}" value="${esc(entry[id]||'')}" ${locked?'disabled':''}></div>`;
if(stage===0||isChallenge){html=`<h2>${t('levelLabels')[stage]}</h2><div class="question"><div class="problem">${esc(ip)}</div><div class="hint">${t('mask')}: ${esc(mask)}</div></div><div class="fields">${field('net',t('network'),'192.168.x.x')}${field('host',t('host'),'0–255')}</div>`}
if(stage===1){let askBinary=index%2===0;html=`<h2>${t('levelLabels')[stage]}</h2><div class="question"><p>${askBinary?t('decToBinary'):t('binaryToDec')}</p><div class="problem">${askBinary?o.dec:o.binary}${askBinary?'₁₀':'₂'}</div></div><div class="fields" style="grid-template-columns:1fr">${field('answer',askBinary?'Binary (8 bit)':'Decimal',askBinary?'01000110':'70')}</div>`}
if(stage===2){html=`<h2>${t('sameQuestion')}</h2><div class="question"><div class="problem">${o.a}<br>↕<br>${o.b}</div><div class="hint">${t('mask')}: ${esc(o.mask)}</div></div><div class="choices"><button class="choice ${selected===true?'selected':''}" data-choice="true" ${locked?'disabled':''}>✅ ${t('yes')}</button><button class="choice ${selected===false?'selected':''}" data-choice="false" ${locked?'disabled':''}>❌ ${t('no')}</button></div>`}
if(stage===3){html=`<h2>${t('errorQuestion')}</h2><div class="question"><div class="problem">${esc(o.ip)}</div><div class="hint">${t('mask')}: ${esc(o.mask)}</div><p style="color:var(--bad)">${t('shown')}: <s>${esc(o.shown)}</s></p></div><div class="fields" style="grid-template-columns:1fr">${field('answer',t('network'),'192.168.x.x')}</div>`}
if(stage===4){let opts=seedShuffle(DATA.match.map(x=>x.network)); // choices shuffled for each render: preserve choice while re-render
 if(!entry.opts)entry.opts=opts; html=`<h2>${t('matchQuestion')}</h2><div class="question"><div class="problem">${esc(o.ip)}</div><div class="hint">${t('mask')}: ${esc(o.mask)}</div></div><div class="choices">${entry.opts.map((x,j)=>`<button class="choice ${selected===j?'selected':''}" data-option="${j}" ${locked?'disabled':''}>${esc(x)}</button>`).join('')}</div>`}
html+=`<div id="feedback"></div><div class="actions"><button class="btn" id="check" ${locked?'disabled':''}>${t('check')}</button><button class="btn secondary hidden" id="next">${index===stageItems.length-1?t('done'):t('next')}</button></div>`;$('exercise').innerHTML=html;
document.querySelectorAll('#exercise input').forEach(input=>{input.oninput=()=>entry[input.id]=input.value;input.onkeydown=e=>{if(e.key==='Enter'&&!locked)check()}});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=b.dataset.choice==='true';document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',(x.dataset.choice==='true')===selected))});document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.option);document.querySelectorAll('[data-option]').forEach(x=>x.classList.toggle('selected',Number(x.dataset.option)===selected))});$('check').onclick=check;$('next').onclick=()=>{if(index===stageItems.length-1)finish();else{index++;locked=false;selected=null;entry={};draw()}};if(locked)showFeedback()}
function normalize(s){return String(s??'').trim().replace(/\s+/g,'').toLowerCase()}function verdict(){let o=stageItems[index];if(stage===0||stage===5)return {ok:normalize(entry.net)===o.network&&normalize(entry.host)===String(o.host),answer:`${o.network} · № ${o.host}`,complete:normalize(entry.net)!==''&&normalize(entry.host)!==''};if(stage===1){let good=index%2===0?o.binary:String(o.dec);return {ok:normalize(entry.answer)===good,answer:good,complete:normalize(entry.answer)!==''}}if(stage===2)return {ok:selected===o.same,answer:o.same?t('yes'):t('no'),complete:selected!==null};if(stage===3)return {ok:normalize(entry.answer)===o.correct,answer:o.correct,complete:normalize(entry.answer)!==''};if(stage===4)return {ok:entry.opts?.[selected]===o.network,answer:o.network,complete:selected!==null}}
function check(){let v=verdict();if(!v.complete){$('feedback').innerHTML=`<div class="feedback bad">${t('fill')}</div>`;return}locked=true;if(v.ok)score++;draw();showFeedback()}
function showFeedback(){let v=verdict();let f=$('feedback');if(!f)return;f.innerHTML=`<div class="feedback ${v.ok?'good':'bad'}">${v.ok?t('right'):t('wrong')+' '+t('correct')+' '+esc(v.answer)}</div>`;$('check').classList.add('hidden');$('next').classList.remove('hidden');$('stageScore').textContent=`⭐ ${score}`}
function finish(){let prev=state.best[stage];state.best[stage]=Math.max(prev,score);save();window.ipQuestCloud?.sync?.();$('finalScore').textContent=score+' / '+stageItems.length;$('finalText').textContent=t('levelLabels')[stage]+' · '+t('resultText')+' '+score;page('finish');renderHome()}
$('language').onchange=e=>{language=e.target.value;state.lang=language;save();translate()};$('nameSave').onclick=()=>{state.name=$('student').value.trim().slice(0,60);save();window.ipQuestCloud?.sync?.();$('nameSave').textContent=t('save');setTimeout(()=>{$('nameSave').textContent=t('saveName')},1100)};$('back').onclick=()=>{stage=-1;page('home');renderHome()};$('finishHome').onclick=()=>{stage=-1;page('home')};$('retry').onclick=()=>start(stage);$('resetBtn').onclick=()=>{if(confirm(t('confirm'))){state.best=[0,0,0,0,0,0];save();window.ipQuestCloud?.sync?.();renderHome()}};$('certificateBtn').onclick=()=>{let complete=state.best.every((v,i)=>v===counts[i]);if(!complete){alert(t('certNeed'));return}$('certTitle').textContent=t('certTitle');$('certName').textContent=state.name||'_______________________';$('certBody').textContent=t('certBody');$('certPoints').textContent='40 / 40 ⭐';$('certDate').textContent=new Date().toLocaleDateString(language==='kk'?'kk-KZ':language==='ru'?'ru-RU':'en-US');page('certPage')};$('certBack').onclick=()=>page('home');translate();
